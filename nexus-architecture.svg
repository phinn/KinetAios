<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <radialGradient id="aBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#23232b"/>
      <stop offset="100%" stop-color="#18181c"/>
    </radialGradient>
    <radialGradient id="aCore" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="35%" stop-color="#f0c84e"/>
      <stop offset="72%" stop-color="#e8b339"/>
      <stop offset="100%" stop-color="#a8731a"/>
    </radialGradient>
    <radialGradient id="aCoreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b339" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e8b339" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e8b339" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aInnerNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#282830"/>
    </linearGradient>
    <linearGradient id="aMidNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33333c"/>
      <stop offset="100%" stop-color="#22222a"/>
    </linearGradient>
    <filter id="aGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aStrongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion:reduce){animate,animateTransform{display:none}}
      text{font-family:'SF Mono','JetBrains Mono','Consolas',monospace}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#aBg)"/>
  <g opacity="0.35" fill="#e8b339">
    <circle cx="120" cy="180" r="0.8"/><circle cx="980" cy="140" r="1"/>
    <circle cx="200" cy="500" r="0.7"/><circle cx="1080" cy="520" r="0.9"/>
    <circle cx="80" cy="400" r="0.6"/><circle cx="1120" cy="380" r="0.8"/>
    <circle cx="300" cy="120" r="0.7"/><circle cx="880" cy="560" r="0.6"/>
  </g>

  <!-- Top status bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#1e1e24" opacity="0.9"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#e8b339" stroke-width="0.5" opacity="0.4"/>
  <g transform="translate(36,24)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#e8b339" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="3.5" fill="#e8b339"/>
    <text x="20" y="5" fill="#e8b339" font-size="14" font-weight="bold" letter-spacing="3">NEXUS</text>
    <text x="86" y="5" fill="#888894" font-size="11" letter-spacing="1">Spatial Cognition Agent</text>
  </g>
  <g transform="translate(960,24)" font-size="9" fill="#888894" letter-spacing="1">
    <text x="0" y="-8" fill="#555560" font-size="7">CPU</text>
    <rect x="0" y="-4" width="48" height="6" rx="3" fill="#27272d"/>
    <rect x="0" y="-4" width="32" height="6" rx="3" fill="#e8b339" opacity="0.7"/>
    <text x="56" y="2" font-size="8">67%</text>
    <text x="90" y="-8" fill="#555560" font-size="7">MEM</text>
    <rect x="90" y="-4" width="48" height="6" rx="3" fill="#27272d"/>
    <rect x="90" y="-4" width="18" height="6" rx="3" fill="#4ec27a" opacity="0.7"/>
    <text x="146" y="2" font-size="8">38%</text>
    <text x="180" y="-8" fill="#555560" font-size="7">NET</text>
    <rect x="180" y="-4" width="48" height="6" rx="3" fill="#27272d"/>
    <rect x="180" y="-4" width="41" height="6" rx="3" fill="#6b9fef" opacity="0.7"/>
    <text x="236" y="2" font-size="8">85%</text>
  </g>

  <!-- ===== L1: CORE ===== -->
  <!-- Core halo -->
  <circle cx="600" cy="350" r="100" fill="url(#aCoreHalo)"/>
  <circle cx="600" cy="350" r="85" fill="url(#aCoreHalo)" filter="url(#aStrongGlow)" opacity="0.6">
    <animate attributeName="r" values="85;100;85" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Core sphere -->
  <circle cx="600" cy="350" r="55" fill="url(#aCore)" filter="url(#aStrongGlow)"/>
  <circle cx="600" cy="350" r="52" fill="url(#aCore)"/>
  <!-- Surface highlight -->
  <ellipse cx="588" cy="335" rx="20" ry="12" fill="#fff6d5" opacity="0.25" filter="url(#aSoftGlow)"/>
  <!-- Pulse ring -->
  <circle cx="600" cy="350" r="64" fill="none" stroke="#e8b339" stroke-width="1.5" opacity="0.4">
    <animate attributeName="r" values="55;85;55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="346" text-anchor="middle" fill="#18181c" font-size="11" font-weight="bold" letter-spacing="2">USER</text>
  <text x="600" y="360" text-anchor="middle" fill="#18181c" font-size="7" opacity="0.6">INTENT</text>

  <!-- ===== L2: INNER RING (3 Primary Agents) ===== -->
  <!-- Orbit ring -->
  <circle cx="600" cy="350" r="140" fill="none" stroke="#e8b339" stroke-width="0.5" opacity="0.12" stroke-dasharray="3 6"/>

  <!-- Connection lines core→inner nodes -->
  <g stroke="#e8b339" stroke-width="1" fill="none" opacity="0.15" filter="url(#aGlow)">
    <line x1="600" y1="350" x2="600" y2="210"/>
    <line x1="600" y1="350" x2="479" y2="420"/>
    <line x1="600" y1="350" x2="721" y2="420"/>
  </g>

  <!-- Node: PERCEPTION (top, 12 o'clock) -->
  <g transform="translate(600,210)">
    <rect x="-68" y="-28" width="136" height="56" rx="14" fill="url(#aInnerNode)" stroke="#e8b339" stroke-width="1.5" filter="url(#aSoftGlow)"/>
    <!-- Eye icon -->
    <g transform="translate(-46,0)" stroke="#e8b339" stroke-width="1.6" fill="none">
      <ellipse cx="0" cy="0" rx="11" ry="6"/>
      <circle cx="0" cy="0" r="3" fill="#e8b339"/>
    </g>
    <text x="-20" y="-4" fill="#dddde3" font-size="9" font-weight="bold" letter-spacing="1">PERCEPTION</text>
    <text x="-20" y="8" fill="#888894" font-size="6">Sensory input layer</text>
    <circle cx="56" cy="-18" r="2.5" fill="#4ec27a">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="translate" values="600,210; 600,206; 600,210" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Node: COGNITION (bottom-left, 8 o'clock) -->
  <g transform="translate(479,420)">
    <rect x="-68" y="-28" width="136" height="56" rx="14" fill="url(#aInnerNode)" stroke="#e8b339" stroke-width="1.5" filter="url(#aSoftGlow)"/>
    <!-- Brain icon -->
    <g transform="translate(-46,0)" stroke="#e8b339" stroke-width="1.6" fill="none">
      <path d="M-8,-6 Q-12,-6 -12,0 Q-12,6 -8,6 M-4,-8 Q-4,-10 0,-10 Q4,-10 4,-8 M4,-6 Q8,-6 8,0 Q8,6 4,6 M-4,8 Q-4,10 0,10 Q4,10 4,8 M-4,-8 L-4,8 M4,-8 L4,8"/>
      <line x1="-4" y1="-2" x2="4" y2="-2" stroke-width="0.8"/>
      <line x1="-4" y1="2" x2="4" y2="2" stroke-width="0.8"/>
    </g>
    <text x="-20" y="-4" fill="#dddde3" font-size="9" font-weight="bold" letter-spacing="1">COGNITION</text>
    <text x="-20" y="8" fill="#888894" font-size="6">Reasoning & planning</text>
    <circle cx="56" cy="-18" r="2.5" fill="#4ec27a"/>
    <animateTransform attributeName="transform" type="translate" values="479,420; 483,423; 479,420" dur="5s" begin="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- Node: EXECUTION (bottom-right, 4 o'clock) -->
  <g transform="translate(721,420)">
    <rect x="-68" y="-28" width="136" height="56" rx="14" fill="url(#aInnerNode)" stroke="#e8b339" stroke-width="1.5" filter="url(#aSoftGlow)"/>
    <!-- Lightning icon -->
    <g transform="translate(-46,0)" stroke="#e8b339" stroke-width="1.6" fill="none">
      <path d="M2,-10 L-5,2 L0,2 L-2,10 L5,-2 L0,-2 Z" fill="#e8b339" fill-opacity="0.2"/>
    </g>
    <text x="-20" y="-4" fill="#dddde3" font-size="9" font-weight="bold" letter-spacing="1">EXECUTION</text>
    <text x="-20" y="8" fill="#888894" font-size="6">Action & tool dispatch</text>
    <circle cx="56" cy="-18" r="2.5" fill="#e8b339">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="translate" values="721,420; 717,423; 721,420" dur="4.5s" begin="1s" repeatCount="indefinite"/>
  </g>

  <!-- ===== L3: MIDDLE RING (6 Tools) ===== -->
  <circle cx="600" cy="350" r="210" fill="none" stroke="#e8b339" stroke-width="0.4" opacity="0.08" stroke-dasharray="2 8"/>

  <!-- Tool nodes at 6 positions -->
  <!-- SHELL (12 o'clock, top) -->
  <g transform="translate(600,140)">
    <rect x="-46" y="-24" width="92" height="48" rx="12" fill="url(#aMidNode)" stroke="#6b6b78" stroke-width="1"/>
    <g transform="translate(-28,0)" stroke="#e8b339" stroke-width="1.2" fill="none" opacity="0.8">
      <rect x="-8" y="-6" width="16" height="12" rx="2"/>
      <text x="0" y="3" text-anchor="middle" fill="#e8b339" font-size="6" stroke="none">$_</text>
    </g>
    <text x="-10" y="-3" fill="#aaaab0" font-size="8" font-weight="bold">SHELL</text>
    <text x="-10" y="8" fill="#555560" font-size="5">TERMINAL</text>
  </g>
  <!-- WEB (2 o'clock) -->
  <g transform="translate(782,236)">
    <rect x="-46" y="-24" width="92" height="48" rx="12" fill="url(#aMidNode)" stroke="#6b6b78" stroke-width="1"/>
    <g transform="translate(-28,0)" stroke="#e8b339" stroke-width="1.2" fill="none" opacity="0.8">
      <circle cx="0" cy="0" r="7"/>
      <ellipse cx="0" cy="0" rx="3" ry="7"/>
      <line x1="-7" y1="0" x2="7" y2="0"/>
    </g>
    <text x="-10" y="-3" fill="#aaaab0" font-size="8" font-weight="bold">WEB</text>
    <text x="-10" y="8" fill="#555560" font-size="5">FETCH/SEARCH</text>
  </g>
  <!-- CODE (4 o'clock) -->
  <g transform="translate(782,464)">
    <rect x="-46" y="-24" width="92" height="48" rx="12" fill="url(#aMidNode)" stroke="#6b6b78" stroke-width="1"/>
    <g transform="translate(-28,0)" stroke="#e8b339" stroke-width="1.2" fill="none" opacity="0.8">
      <path d="M-4,-5 L-8,0 L-4,5 M4,-5 L8,0 L4,5"/>
    </g>
    <text x="-10" y="-3" fill="#aaaab0" font-size="8" font-weight="bold">CODE</text>
    <text x="-10" y="8" fill="#555560" font-size="5">EDIT/COMPILE</text>
  </g>
  <!-- FILE (6 o'clock, bottom) -->
  <g transform="translate(600,560)">
    <rect x="-46" y="-24" width="92" height="48" rx="12" fill="url(#aMidNode)" stroke="#6b6b78" stroke-width="1"/>
    <g transform="translate(-28,0)" stroke="#e8b339" stroke-width="1.2" fill="none" opacity="0.8">
      <path d="M-5,-7 L3,-7 L7,-3 L7,7 L-5,7 Z M3,-7 L3,-3 L7,-3"/>
    </g>
    <text x="-10" y="-3" fill="#aaaab0" font-size="8" font-weight="bold">FILE</text>
    <text x="-10" y="8" fill="#555560" font-size="5">READ/WRITE</text>
  </g>
  <!-- MEMORY (8 o'clock) -->
  <g transform="translate(418,464)">
    <rect x="-46" y="-24" width="92" height="48" rx="12" fill="url(#aMidNode)" stroke="#6b6b78" stroke-width="1"/>
    <g transform="translate(-28,0)" stroke="#e8b339" stroke-width="1.2" fill="none" opacity="0.8">
      <path d="M-5,-3 L0,-7 L5,-3 L5,5 L0,8 L-5,5 Z"/>
      <circle cx="0" cy="1" r="2"/>
    </g>
    <text x="-10" y="-3" fill="#aaaab0" font-size="8" font-weight="bold">MEMORY</text>
    <text x="-10" y="8" fill="#555560" font-size="5">VECTOR DB</text>
  </g>
  <!-- SCHEDULE (10 o'clock) -->
  <g transform="translate(418,236)">
    <rect x="-46" y="-24" width="92" height="48" rx="12" fill="url(#aMidNode)" stroke="#6b6b78" stroke-width="1"/>
    <g transform="translate(-28,0)" stroke="#e8b339" stroke-width="1.2" fill="none" opacity="0.8">
      <circle cx="0" cy="1" r="7"/>
      <line x1="0" y1="-6" x2="0" y2="1"/>
      <line x1="0" y1="1" x2="5" y2="3"/>
    </g>
    <text x="-10" y="-3" fill="#aaaab0" font-size="8" font-weight="bold">SCHEDULE</text>
    <text x="-10" y="8" fill="#555560" font-size="5">CRON/TIMER</text>
  </g>

  <!-- ===== L4: OUTER RING (Data Stream) ===== -->
  <circle cx="600" cy="350" r="300" fill="none" stroke="#e8b339" stroke-width="0.6" opacity="0.1" stroke-dasharray="4 12">
    <animateTransform attributeName="transform" type="rotate" from="0 600 350" to="360 600 350" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="350" r="290" fill="none" stroke="#e8b339" stroke-width="0.4" opacity="0.06" stroke-dasharray="2 16">
    <animateTransform attributeName="transform" type="rotate" from="360 600 350" to="0 600 350" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Flowing particles on outer ring -->
  <g fill="#e8b339" filter="url(#aGlow)">
    <circle r="2.5" opacity="0.6">
      <animateMotion dur="14s" repeatCount="indefinite" path="M 900,350 A 300,300 0 1,1 899.9,350.1 Z"/>
    </circle>
    <circle r="2" opacity="0.4">
      <animateMotion dur="14s" begin="4.6s" repeatCount="indefinite" path="M 900,350 A 300,300 0 1,1 899.9,350.1 Z"/>
    </circle>
    <circle r="1.5" opacity="0.5">
      <animateMotion dur="14s" begin="9.3s" repeatCount="indefinite" path="M 900,350 A 300,300 0 1,1 899.9,350.1 Z"/>
    </circle>
  </g>

  <!-- Layer labels -->
  <g font-size="8" letter-spacing="1.5">
    <g transform="translate(40,260)">
      <text x="0" y="0" fill="#e8b339" font-size="8" opacity="0.6">L5 · AMBIENT</text>
      <text x="0" y="22" fill="#e8b339" font-size="8" opacity="0.6">L4 · OUTER</text>
      <text x="0" y="32" fill="#6b6b78" font-size="6">DATA STREAM</text>
      <text x="0" y="56" fill="#e8b339" font-size="8" opacity="0.6">L3 · MIDDLE</text>
      <text x="0" y="66" fill="#6b6b78" font-size="6">TOOLS · SKILLS</text>
      <text x="0" y="90" fill="#e8b339" font-size="8" opacity="0.6">L2 · INNER</text>
      <text x="0" y="100" fill="#6b6b78" font-size="6">PRIMARY AGENTS</text>
      <text x="0" y="124" fill="#e8b339" font-size="8" opacity="0.8" font-weight="bold">L1 · CORE</text>
      <text x="0" y="134" fill="#6b6b78" font-size="6">INTENT ORB</text>
    </g>
  </g>

  <!-- ===== L5: AMBIENT — Bottom Input Bar ===== -->
  <g transform="translate(600,640)">
    <!-- Arc background -->
    <path d="M -330,0 Q -200,-30 0,-30 Q 200,-30 330,0" fill="#1a1a1f" opacity="0.8"/>
    <path d="M -330,0 Q -200,-30 0,-30 Q 200,-30 330,0" fill="none" stroke="#e8b339" stroke-width="1" opacity="0.3"/>
    <!-- Input text -->
    <text x="-310" y="-8" fill="#e8b339" font-size="14">›</text>
    <rect x="-308" y="-10" width="2" height="20" fill="#e8b339">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="-298" y="6" fill="#555560" font-size="11" letter-spacing="0.5">Express your intent…</text>
    <!-- Send button -->
    <g transform="translate(300,0)">
      <circle cx="0" cy="0" r="16" fill="#e8b339" opacity="0.15"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#e8b339" stroke-width="1.2"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#e8b339" stroke-width="1.5"/>
      <polyline points="2,-3 5,0 2,3" fill="none" stroke="#e8b339" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Mode switch -->
  <g transform="translate(90,660)" font-size="9" letter-spacing="1">
    <text x="0" y="-8" fill="#555560">MODE</text>
    <rect x="0" y="-2" width="3" height="14" rx="1" fill="#e8b339"/>
    <text x="8" y="8" fill="#e8b339" font-weight="bold">ORBIT</text>
    <text x="44" y="8" fill="#555560">FLOW</text>
    <text x="72" y="8" fill="#555560">STAR</text>
  </g>

  <!-- Version -->
  <text x="1130" y="680" text-anchor="end" fill="#555560" font-size="7" letter-spacing="2">NEXUS v0.1.0-alpha</text>
</svg>