.lang button:not(.on):hover{color:var(--text)}
header{padding:64px 0 40px;border-bottom:1px solid var(--line)}

  const dict = I18N[l]; if(!dict) return;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if(dict[k] != null) el.textContent = dict[k];
  });
  document.documentElement.lang = l;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  try{ localStorage.setItem("ka_lang", l); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.l)));
const urlLang = new URLSearchParams(location.search).get("lang");
const saved = (()=>{try{return localStorage.getItem("ka_lang")}catch(e){return null}})();
applyLang(urlLang && I18N[urlLang] ? urlLang : (saved && I18N[saved] ? saved : "zh-Hans"));
</script>

</body>
</html>
