name: pages

# 仅当 docs/ 下的页面资源变更时才重新部署 GitHub Pages。
# 避免:每次 push 代码/文档/wiki 都触发 Pages 重建,拖慢 Release CI。
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/**/*.html'
      - 'docs/**/*.css'
      - 'docs/**/*.js'
      - 'docs/**/*.png'
      - 'docs/**/*.jpg'
      - 'docs/**/*.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
