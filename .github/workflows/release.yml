name: release

# 触发:打 v* 开头的 tag(如 v0.1.0)→ 自动构建 win + mac 并发 Release;
# 或 Actions 页面手动 dispatch(只产 artifact,不发 Release)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GH Actions 默认 GITHUB_TOKEN 只读 → softprops/action-gh-release 建 Release 要 contents: write
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            mac_arch: ''
            run_dist: npm run dist
            artifact_glob: release/KinetAios*Setup*.exe
          # macOS x64 + arm64 拆成两个 job —— electron-builder #10031 bug:
          # 同一 job 顺序打双架构会打包错误架构的 native module。
          - os: macos-latest
            mac_arch: x64
            run_dist: npm run dist:mac
            artifact_glob: release/KinetAios-*.dmg
          - os: macos-latest
            mac_arch: arm64
            run_dist: npm run dist:mac
            artifact_glob: release/KinetAios-*.dmg
    runs-on: ${{ matrix.os }}
    env:
      MAC_ARCH: ${{ matrix.mac_arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .npmrc 强制走 npmmirror(国内拉 electron 用),GH Actions 机房连官方源更快 → 删之。
      - run: node -e "require('fs').rmSync('.npmrc',{force:true})"

      - run: npm install --no-audit --no-fund

      - shell: bash
        run: |
          set -o pipefail
          ${{ matrix.run_dist }} 2>&1 | tee dist.log

      # macOS: 打包后列出 DMG 文件名,便于诊断 electron-builder 输出
      - name: List release dir (macOS)
        if: matrix.mac_arch != ''
        shell: bash
        run: |
          echo "=== release/ contents ==="
          ls -la release/*.dmg 2>/dev/null || echo "(no dmg found)"
          echo "=== renaming to ensure arch suffix ==="
          # electron-builder 单架构打包时文件名可能不含 -x64/-arm64 后缀
          # 重命名确保文件名带架构标识,避免两个 job 产物同名冲突
          for f in release/*.dmg; do
            base=$(basename "$f" .dmg)
            # 已经有 -x64 或 -arm64 后缀 → 跳过
            if [[ "$base" == *-x64 || "$base" == *-arm64 ]]; then
              echo "  skip (already has arch suffix): $f"
              continue
            fi
            # 去掉可能存在的 -arm64 后缀的旧文件
            newname="release/${base}-${MAC_ARCH}.dmg"
            echo "  rename: $f → $newname"
            mv "$f" "$newname"
          done
          echo "=== final release/ ==="
          ls -la release/*.dmg

      - name: Upload dist log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-log-${{ matrix.os }}-${{ matrix.mac_arch }}
          path: dist.log

      # 上传到 Actions 的 artifact
      - uses: actions/upload-artifact@v4
        with:
          name: KinetAios-${{ matrix.os }}-${{ matrix.mac_arch || 'win' }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

      # 打 tag 时:把构建产物贴到 GH Release
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          generate_release_notes: true
          fail_on_unmatched_files: false
