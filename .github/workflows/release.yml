name: release

# 触发:打 v* 开头的 tag(如 v0.1.0)→ 自动构建 win + mac 并发 Release;
# 或 Actions 页面手动 dispatch(只产 artifact,不发 Release)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GH Actions 默认 GITHUB_TOKEN 只读 → softprops/action-gh-release 建 Release 要 contents: write
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false  # 一个 OS/架构失败不连累另一个
      matrix:
        include:
          - os: windows-latest
            mac_arch: ''
            run_dist: npm run dist
            artifact_glob: release/KinetAios*Setup*.exe
          # macOS x64 + arm64 拆成两个 job —— electron-builder #10031 bug:
          # 同一 job 顺序打双架构会打包错误架构的 native module。
          # 各自只打一个架构,打包前手动 rebuild 对应架构的 better-sqlite3。
          - os: macos-latest
            mac_arch: x64
            run_dist: npm run dist:mac
            artifact_glob: release/KinetAios-*-x64.dmg
          - os: macos-latest
            mac_arch: arm64
            run_dist: npm run dist:mac
            artifact_glob: release/KinetAios-*-arm64.dmg
    runs-on: ${{ matrix.os }}
    env:
      MAC_ARCH: ${{ matrix.mac_arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .npmrc 强制走 npmmirror(国内拉 electron 用),GH Actions 机房连官方源更快 → 删之。
      - run: node -e "require('fs').rmSync('.npmrc',{force:true})"

      # postinstall 会跑 electron-rebuild 重编 better-sqlite3(编出 host=arm64 的)。
      # macOS x64 job 会在下面 pack.js 里重新 rebuild 成 x64。
      - run: npm install --no-audit --no-fund

      # dist / dist:mac 内部已经先 build 再 electron-builder(pack.js)
      # tee 到日志文件,失败时上传成 artifact 方便诊断。
      - shell: bash
        run: |
          set -o pipefail
          ${{ matrix.run_dist }} 2>&1 | tee dist.log

      - name: Upload dist log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-log-${{ matrix.os }}-${{ matrix.mac_arch }}
          path: dist.log

      # 上传到 Actions 的 artifact
      - uses: actions/upload-artifact@v4
        with:
          name: KinetAios-${{ matrix.os }}-${{ matrix.mac_arch || 'win' }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

      # 打 tag 时:把构建产物贴到 GH Release
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          generate_release_notes: true
          fail_on_unmatched_files: false
