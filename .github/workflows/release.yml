name: release

# 触发:打 v* 开头的 tag(如 v0.1.0)→ 自动构建 win + mac 并发 Release;
# 或 Actions 页面手动 dispatch(只产 artifact,不发 Release)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GH Actions 默认 GITHUB_TOKEN 只读 → softprops/action-gh-release 建 Release 要 contents: write
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            mac_arch: ''
            run_dist: npm run dist
            artifact_glob: release/KinetAios*Setup*.exe
          # macOS x64 + arm64 拆成两个 job —— electron-builder #10031 bug:
          # 同一 job 顺序打双架构会打包错误架构的 native module。
          - os: macos-latest
            mac_arch: x64
            run_dist: npm run dist:mac
            artifact_glob: release/KinetAios-*.dmg
          - os: macos-latest
            mac_arch: arm64
            run_dist: npm run dist:mac
            artifact_glob: release/KinetAios-*.dmg
    runs-on: ${{ matrix.os }}
    env:
      MAC_ARCH: ${{ matrix.mac_arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .npmrc 强制走 npmmirror(国内拉 electron 用),GH Actions 机房连官方源更快 → 删之。
      - run: node -e "require('fs').rmSync('.npmrc',{force:true})"

      - run: npm install --no-audit --no-fund

      # macOS: 导入 Developer ID 证书到临时 keychain(打 tag 发 Release 时才签,手动 dispatch 不签不公证)
      - name: Import Developer ID cert
        if: matrix.mac_arch != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp -d)/cert.p12
          echo "$MAC_CERT_P12" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "" build.keychain-db
          security import "$CERT_FILE" -k build.keychain-db -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain-db
          security list-keychain -s build.keychain-db login.keychain-db
          rm -f "$CERT_FILE"

      # macOS 公证凭据(打 tag 时) — scripts/notarize.js afterSign 钩子读取
      - name: Set notarize env
        if: matrix.mac_arch != '' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          echo "CSC_NAME=JUNJIE SHEN (M92UKS6NA2)" >> "$GITHUB_ENV"

      - shell: bash
        run: |
          set -o pipefail
          ${{ matrix.run_dist }} 2>&1 | tee dist.log

      # macOS: 打包后列出 DMG 文件名,便于诊断 electron-builder 输出
      - name: List release dir (macOS)
        if: matrix.mac_arch != ''
        shell: bash
        run: |
          echo "=== release/ contents ==="
          ls -la release/*.dmg 2>/dev/null || echo "(no dmg found)"
          echo "=== renaming to ensure arch suffix ==="
          # electron-builder 单架构打包时文件名可能不含 -x64/-arm64 后缀
          # 重命名确保文件名带架构标识,避免两个 job 产物同名冲突
          for f in release/*.dmg; do
            base=$(basename "$f" .dmg)
            # 已经有 -x64 或 -arm64 后缀 → 跳过
            if [[ "$base" == *-x64 || "$base" == *-arm64 ]]; then
              echo "  skip (already has arch suffix): $f"
              continue
            fi
            # 去掉可能存在的 -arm64 后缀的旧文件
            newname="release/${base}-${MAC_ARCH}.dmg"
            echo "  rename: $f → $newname"
            mv "$f" "$newname"
          done
          echo "=== final release/ ==="
          ls -la release/*.dmg
          # 删掉重命名前的原始文件(无 arch 后缀),避免 glob 重复上传到 Release
          for f in release/KinetAios-*.dmg; do
            base=$(basename "$f" .dmg)
            if [[ "$base" != *-x64 && "$base" != *-arm64 ]]; then
              echo "  cleanup: rm $f"
              rm -f "$f"
            fi
          done

      - name: Upload dist log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-log-${{ matrix.os }}-${{ matrix.mac_arch }}
          path: dist.log

      # 上传到 Actions 的 artifact
      - uses: actions/upload-artifact@v4
        with:
          name: KinetAios-${{ matrix.os }}-${{ matrix.mac_arch || 'win' }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

      # 打 tag 时:把构建产物贴到 GH Release
      # body 优先取 RELEASE_NOTES.md 里 "## <tag>" 起到下一个 "## " 或文件尾的段落;
      # 抽不到(如忘写)回落 GH 自动生成,保证 Release 永不为空。
      # 注意:TAG 必须在 node -e 内声明(bash 声明后 JS 里裸写 TAG.replace 不会被 bash 内插 → ReferenceError)。
      # / On tag push: attach artifacts. Body extracts the "## <tag>" section
      # from RELEASE_NOTES.md, falling back to GH-generated notes if absent.
      - name: Extract release notes body
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const TAG = '${GITHUB_REF_NAME#v}'; // bash 内插为 JS 字符串字面量;此前裸用 TAG 变量 → ReferenceError 炸掉整个 step
            const md = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            const m = md.match(new RegExp('(^|\\\\n)## v' + TAG.replace(/[.*+?^\${}()|[\]\\\\]/g, '\\\\$&') + '(?![0-9])[^\\\\n]*\\\\n([\\\\s\\\\S]*?)(?=\\\\n## |\\\\n*\$)', ''));
            const body = m ? m[2].trim() : '';
            fs.writeFileSync('release-body.md', body);
            console.log(body ? 'extracted ' + body.length + ' chars' : 'no section for v' + '${TAG}' + ', fallback to auto notes');
          "
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: false

  # README 安装包版本号自动跟进 tag(此前手工维护,3.3→3.5 曾漏更)。
  # 独立 job 而非塞进 matrix:build 有 3 个矩阵 job,塞进去会互相竞争提交。
  readme-sync:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync install version in READMEs
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i -E "s/KinetAios-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe/KinetAios-Setup-${VER}.exe/g" README.md README.zh-CN.md
          if git diff --quiet; then
            echo "README already at v${VER}, nothing to do"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.zh-CN.md
            git commit -m "docs(readme): 安装包版本号自动跟进 v${VER}"
            git push
          fi
