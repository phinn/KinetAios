<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 背景圆 -->
  <circle cx="32" cy="32" r="30" fill="#00979D"/>
  <!-- Arduino 风格:无限符号(横放)代表串行通信 -->
  <!-- 左半圆 -->
  <path d="M 20 32 A 8 8 0 1 1 20 31.99" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- 右半圆 -->
  <path d="M 44 32 A 8 8 0 1 1 44 31.99" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- 负极标记 -->
  <line x1="16" y1="32" x2="13" y2="32" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="14.5" y1="29" x2="14.5" y2="35" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- 正极标记 -->
  <line x1="48" y1="32" x2="51" y2="32" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
